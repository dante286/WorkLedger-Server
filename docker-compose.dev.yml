services:
  postgres:
    image: postgres:18-alpine
    container_name: workledger-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: workledger
      POSTGRES_PASSWORD: workledger
      POSTGRES_DB: workledger
    ports:
      - "15432:5432"
    volumes:
      - workledger-postgres-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workledger -d workledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workledger-postgres-dev-data:
