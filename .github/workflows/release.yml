# Builds and publishes the production image when a version tag is pushed. Deployment itself stays the
# operator's `docker compose pull && docker compose up -d` — nothing here touches a live environment.
#
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # the GitHub Release below
  packages: write   # push to GHCR

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.ref_name is the tag verbatim, e.g. "v0.2.0", but VERSION below lands on
      # -p:InformationalVersion, and MSBuild rejects a leading "v" as an invalid NuGet version
      # string (NETSDK1018). That is why the v0.1.0 release build failed: it published no image
      # and never reached the release step. Strip the prefix here so the whole repo agrees that
      # VERSION is a bare semver -- the Dockerfile's own default is 0.0.0-dev, and compose passes
      # WORKLEDGER_VERSION unprefixed. docker/metadata-action below keeps taking the raw tag,
      # since type=semver parses the "v" happily; it is only the build arg that cannot.
      - name: Strip the tag's leading "v" for the build arg
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lower-cased for us (GHCR rejects the repo's mixed-case name), which is why this resolves to
          # the ghcr.io/dante286/workledger-api that docker-compose.yml names.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamped onto AssemblyInformationalVersion, so GET / on a deployed container reports the tag
          # it was built from.
          build-args: |
            VERSION=${{ steps.version.outputs.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container image: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

            Deploy: copy `.env.example` to `.env`, fill in the secrets, then
            `WORKLEDGER_VERSION=${{ github.ref_name }} docker compose up -d`.
            See README.md for the operator quickstart.
