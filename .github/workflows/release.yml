# Builds and publishes the production image when a version tag is pushed. Deployment itself stays the
# operator's `docker compose pull && docker compose up -d` — nothing here touches a live environment.
#
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # the GitHub Release below
  packages: write   # push to GHCR

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Neither github.ref_name nor github.repository is usable verbatim below, in two different
      # ways, so both are normalized here once:
      #
      #   number  The tag is "v0.2.0", but VERSION lands on -p:InformationalVersion and MSBuild
      #           rejects a leading "v" as an invalid NuGet version string (NETSDK1018) -- that is
      #           why the v0.1.0 release build failed and published nothing. It is also the tag
      #           metadata-action's type=semver,pattern={{version}} actually pushes, so it is what
      #           the release note has to tell operators to pull. The rest of the repo already
      #           agrees a bare semver is the convention: the Dockerfile defaults VERSION to
      #           0.0.0-dev and compose passes WORKLEDGER_VERSION unprefixed.
      #   image   github.repository is mixed-case ("dante286/WorkLedger-API") and GHCR rejects
      #           that, so metadata-action lower-cases it for the push. The release note has to
      #           lower-case it too, or it hands out an image reference that cannot resolve.
      #
      # metadata-action below keeps taking the raw values -- type=semver parses the "v" happily and
      # the action lower-cases the image itself. It is the build arg and the release body that
      # cannot.
      - name: Derive the image name and version
        id: version
        run: |
          echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lower-cased for us (GHCR rejects the repo's mixed-case name), which is why this resolves to
          # the ghcr.io/dante286/workledger-api that docker-compose.yml names.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamped onto AssemblyInformationalVersion, so GET / on a deployed container reports the tag
          # it was built from.
          build-args: |
            VERSION=${{ steps.version.outputs.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container image: `${{ steps.version.outputs.image }}:${{ steps.version.outputs.number }}`

            Deploy: copy `.env.example` to `.env`, fill in the secrets, then
            `WORKLEDGER_VERSION=${{ steps.version.outputs.number }} docker compose up -d`.
            See README.md for the operator quickstart, and its "Upgrading" sections before
            moving between minor versions.
