name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WorkLedger-Server.slnx

      - name: Build
        run: dotnet build WorkLedger-Server.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WorkLedger-Server.slnx --configuration Release --no-build
